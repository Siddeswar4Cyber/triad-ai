server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend backend:5000;
        proxy_pass http://$backend$request_uri;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
