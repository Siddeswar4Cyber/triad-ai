name: triad-ai

services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: "${MONGODB_URI:-mongodb://mongo:27017}"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-triad_dms}"
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./backend/app.py:/app/app.py:ro
      - ./backend/auth.py:/app/auth.py:ro
      - ./backend/documents.py:/app/documents.py:ro

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5174:5173"
    volumes:
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
      - ./frontend/src:/app/src:ro

volumes:
  mongo_data: